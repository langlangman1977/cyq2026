<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>造价通 · 清单审核系统</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
            background:#f0f2f5; min-height:100vh;
        }
        .header {
            background:linear-gradient(135deg,#1a3a5c,#2d6aa0);
            color:#fff; padding:16px 32px; display:flex; align-items:center;
            justify-content:space-between; box-shadow:0 2px 8px rgba(0,0,0,0.15);
        }
        .header .logo { font-size:22px; font-weight:700; }
        .header .logo span { color:#ffd54f; }
        .container { max-width:1300px; margin:0 auto; padding:24px 20px; }
        .tabs { display:flex; background:#fff; border-radius:12px; overflow:hidden;
                box-shadow:0 1px 4px rgba(0,0,0,0.06); margin-bottom:24px; }
        .tab { flex:1; padding:14px 16px; text-align:center; cursor:pointer; font-size:14px;
               font-weight:500; color:#666; border-bottom:3px solid transparent; transition:.2s; user-select:none; }
        .tab:hover { color:#2d6aa0; background:#f8fafc; }
        .tab.active { color:#2d6aa0; border-bottom-color:#2d6aa0; font-weight:700; }
        .panel { background:#fff; border-radius:12px; padding:28px; box-shadow:0 1px 4px rgba(0,0,0,0.06); }
        .panel.hidden { display:none; }
        .form-row { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; align-items:center; }
        .form-row input, .form-row select { flex:1; min-width:150px; padding:12px 16px; border:1.5px solid #e0e0e0;
                border-radius:8px; font-size:15px; outline:none; }
        .form-row input:focus { border-color:#2d6aa0; }
        .btn {
            padding:12px 28px; border:none; border-radius:8px; font-size:15px; font-weight:600;
            cursor:pointer; transition:.2s; white-space:nowrap;
        }
        .btn-primary { background:#2d6aa0; color:#fff; }
        .btn-primary:hover { background:#1a3a5c; }
        .btn-primary:disabled { background:#b0c4d8; cursor:not-allowed; }
        .btn-success { background:#27ae60; color:#fff; }
        .btn-success:hover { background:#219a52; }
        .btn-outline { background:#fff; color:#2d6aa0; border:1.5px solid #2d6aa0; }
        .btn-outline:hover { background:#eef4fa; }
        .btn-danger { background:#e74c3c; color:#fff; }
        .upload-zone {
            border:2px dashed #ccc; border-radius:10px; padding:40px; text-align:center;
            cursor:pointer; color:#999; transition:.2s; margin-bottom:16px;
        }
        .upload-zone:hover { border-color:#2d6aa0; color:#2d6aa0; }
        .upload-zone .icon { font-size:42px; margin-bottom:8px; }
        .file-name { color:#2d6aa0; font-weight:600; margin-top:8px; }
        .result-card { background:#f8fafc; border:1px solid #e8ecf0; border-radius:10px; padding:20px; margin-bottom:16px; }
        .result-card h3 { color:#1a3a5c; margin-bottom:8px; }
        .stat-row { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:12px; }
        .stat-badge { background:#f0f6fb; padding:10px 18px; border-radius:8px; font-size:14px; }
        .stat-badge strong { color:#2d6aa0; }
        .stat-badge.red strong { color:#e74c3c; }
        .stat-badge.yellow strong { color:#f39c12; }
        table { width:100%; border-collapse:collapse; margin-top:16px; font-size:14px; }
        th { background:#1a3a5c; color:#fff; padding:10px 12px; text-align:left; font-weight:500; }
        td { padding:10px 12px; border-bottom:1px solid #eee; }
        tr.high td { background:#fff0f0; }
        tr.medium td { background:#fffef0; }
        tr.normal td { background:#f0faf0; }
        .loading { display:none; text-align:center; padding:24px; color:#888; }
        .loading.show { display:block; }
        .spinner { width:32px; height:32px; border:3px solid #e0e0e0; border-top-color:#2d6aa0;
                   border-radius:50%; animation:spin .8s linear infinite; margin:0 auto 12px; }
        @keyframes spin { to{transform:rotate(360deg)} }
        .empty { color:#999; text-align:center; padding:40px; }
        .tag { display:inline-block; padding:2px 10px; border-radius:12px; font-size:12px; }
        .tag-red { background:#fdd; color:#c62828; }
        .tag-yellow { background:#ffe; color:#f57f17; }
        .tag-green { background:#e8f5e9; color:#2e7d32; }
        .indicator-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; margin-top:16px; }
        .indicator-card { background:#f8fafc; border:1px solid #e8ecf0; border-radius:8px; padding:14px; }
        .indicator-card .label { font-size:13px; color:#888; }
        .indicator-card .value { font-size:20px; font-weight:700; color:#1a3a5c; }
        .indicator-card .range { font-size:12px; color:#aaa; }
        .indicator-card.warn { border-color:#f39c12; background:#fffefa; }
        @media (max-width:768px) {
            .form-row { flex-direction:column; }
            .header { padding:12px 16px; }
            .header .logo { font-size:16px; }
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">🏗️ <span>造价通</span> · 清单智能审核</div>
    <div style="font-size:13px;opacity:.85">中联永信工程管理 · 20年造价师经验驱动</div>
</div>

<div class="container">
    <div class="tabs">
        <div class="tab active" onclick="switchTab('audit')">📊 清单审核</div>
        <div class="tab" onclick="switchTab('search')">🔍 材料查询</div>
        <div class="tab" onclick="switchTab('memory')">🧠 记忆库</div>
    </div>

    <!-- ====== 清单审核面板 ====== -->
    <div class="panel" id="panel-audit">

        <div style="margin-bottom:20px;color:#888;font-size:14px">
            上传一份已标价的工程量清单Excel文件，智能体将逐条审核每个子目的单价合理性
        </div>

        <!-- 上传区 -->
        <div class="upload-zone" id="auditDropZone" onclick="document.getElementById('auditFileInput').click()">
            <div class="icon">📂</div>
            <div id="auditDropText">点击上传 或 拖拽清单文件到此处</div>
            <div style="font-size:13px;color:#bbb;margin-top:4px">支持 .xlsx / .xls / .pdf / .csv 格式</div>
            <div class="file-name" id="auditFileName" style="display:none"></div>
        </div>
        <input type="file" id="auditFileInput" accept=".xlsx,.xls,.pdf,.csv" style="display:none" onchange="handleAuditFile(event)">

        <!-- 参数配置 -->
        <div class="form-row" style="margin-top:16px">
            <select id="buildingType">
                <option value="工业建筑">工业建筑（破碎楼/转运站/厂房）</option>
                <option value="民用建筑">民用建筑（住宅/公建）</option>
            </select>
            <input id="projectArea" type="number" placeholder="建筑面积（m²，选填）" style="max-width:200px">
            <input id="projectName" type="text" placeholder="项目名称（选填）">
            <button class="btn btn-primary" onclick="runAudit()" id="auditBtn" disabled>🤖 开始审核</button>
        </div>

        <!-- Loading -->
        <div class="loading" id="auditLoading">
            <div class="spinner"></div>
            <span id="auditLoadingText">正在解析清单...</span>
        </div>

        <!-- 审核结果 -->
        <div id="auditResults" style="display:none;margin-top:24px"></div>
    </div>

    <!-- ====== 材料查询面板 ====== -->
    <div class="panel hidden" id="panel-search">
        <div class="form-row">
            <input id="keyword" type="text" placeholder="输入材料名称，如：C30混凝土、HRB400螺纹钢...">
            <input id="region" type="text" placeholder="地区（可选）" style="max-width:180px">
            <button class="btn btn-primary" onclick="singleSearch()">查 询</button>
        </div>
        <div id="singleResults" class="results-area" style="display:none;margin-top:16px"></div>
        <div class="loading" id="singleLoading">
            <div class="spinner"></div>
            <span>正在搜索价格...</span>
        </div>
    </div>

    <!-- ====== 记忆库面板 ====== -->
    <div class="panel hidden" id="panel-memory">
        <div class="form-row">
            <button class="btn btn-primary" onclick="loadMemoryStats()">📊 刷新统计</button>
            <button class="btn btn-outline" onclick="loadMemoryProjects()">📋 已审项目</button>
            <input id="recallKeyword" type="text" placeholder="召回子目名称...">
            <button class="btn btn-success" onclick="recallPrice()">🧠 查历史价</button>
        </div>
        <div id="memoryContent" style="margin-top:16px"></div>
    </div>
</div>

<script>
let auditFile = null;

// Tab 切换
const tabMap = {audit:1, search:2, memory:3};
function switchTab(name) {
    document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', tabMap[name]===i+1));
    document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
    document.getElementById('panel-'+name).classList.remove('hidden');
}

// ========== 拖拽上传 ==========
const auditZone = document.getElementById('auditDropZone');
['dragover'].forEach(ev => auditZone.addEventListener(ev, e=>{e.preventDefault()}));
auditZone.addEventListener('drop', e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file) setAuditFile(file);
});
function handleAuditFile(e) { if (e.target.files[0]) setAuditFile(e.target.files[0]); }
function setAuditFile(file) {
    auditFile = file;
    document.getElementById('auditFileName').textContent = '已选择: ' + file.name;
    document.getElementById('auditFileName').style.display = 'block';
    document.getElementById('auditDropText').textContent = '点击更换文件';
    document.getElementById('auditBtn').disabled = false;
}

// ========== 审核流程 ==========
async function runAudit() {
    if (!auditFile) return;
    const btn = document.getElementById('auditBtn');
    const load = document.getElementById('auditLoading');
    const results = document.getElementById('auditResults');
    const loadText = document.getElementById('auditLoadingText');

    btn.disabled = true;
    results.style.display = 'none';
    load.classList.add('show');

    // Step 1: upload & parse
    loadText.textContent = '正在上传并解析清单...';
    const formData = new FormData();
    formData.append('file', auditFile);
    formData.append('building_type', document.getElementById('buildingType').value);
    formData.append('area', document.getElementById('projectArea').value || '0');
    formData.append('project_name', document.getElementById('projectName').value || '');

    let auditData;
    try {
        const res = await fetch('/api/audit', { method:'POST', body:formData });
        auditData = await res.json();
        if (auditData.error) { throw new Error(auditData.error); }
    } catch(e) {
        results.innerHTML = `<div style="color:#e74c3c">审核失败: ${e.message}</div>`;
        results.style.display = 'block';
        load.classList.remove('show');
        btn.disabled = false;
        return;
    }

    // Step 2: show results
    loadText.textContent = '正在生成审核报告...';
    await new Promise(r => setTimeout(r, 300));
    results.innerHTML = renderAuditResult(auditData);
    results.style.display = 'block';
    load.classList.remove('show');
    btn.disabled = false;
}

function renderAuditResult(data) {
    let html = '<div class="result-card"><h3>📊 审核摘要</h3>';
    html += '<div class="stat-row">';
    html += `<div class="stat-badge">总造价：<strong>${(data.total_price/10000).toFixed(2)} 万元</strong></div>`;
    html += `<div class="stat-badge">审核子目：<strong>${data.item_count || 0} 条</strong></div>`;
    html += `<div class="stat-badge red">严重偏差：<strong>${data.high_count || 0} 条</strong></div>`;
    html += `<div class="stat-badge yellow">需注意：<strong>${data.med_count || 0} 条</strong></div>`;
    html += `<div class="stat-badge">正常：<strong>${(data.item_count||0) - (data.high_count||0) - (data.med_count||0)} 条</strong></div>`;
    html += '</div></div>';

    // 指标
    if (data.indicators && Object.keys(data.indicators).length > 0) {
        html += '<div class="result-card"><h3>📐 工程量指标</h3><div class="indicator-grid">';
        for (const [name, info] of Object.entries(data.indicators)) {
            const cls = info.ok ? '' : 'warn';
            html += `<div class="indicator-card ${cls}">
                <div class="label">${name}</div>
                <div class="value">${info.value}</div>
                <div class="range">参考范围: ${info.range || ''}</div>
            </div>`;
        }
        html += '</div></div>';
    }

    // 偏差清单
    if (data.findings && data.findings.length > 0) {
        html += '<div class="result-card"><h3>⚠️ 异常项目清单</h3>';
        html += '<table><thead><tr><th>风险</th><th>子目名称</th><th>单位</th><th>工程量</th><th>单价</th><th>参考区间</th><th>偏差</th></tr></thead><tbody>';
        data.findings.forEach(f => {
            const rowCls = f.level === 'high' ? 'high' : 'medium';
            const tagCls = f.level === 'high' ? 'tag-red' : 'tag-yellow';
            const tag = f.level === 'high' ? '严重' : '注意';
            html += `<tr class="${rowCls}">
                <td><span class="tag ${tagCls}">${tag}</span></td>
                <td><strong>${f.name || ''}</strong></td>
                <td>${f.unit || ''}</td><td>${f.qty || ''}</td>
                <td style="color:#e74c3c;font-weight:700">${f.price || ''}</td>
                <td>${f.ref_range || ''}</td>
                <td style="font-weight:700">${(f.deviation||0).toFixed(1)}%</td>
            </tr>`;
        });
        html += '</tbody></table></div>';
    }

    // 下载按钮
    if (data.report_file) {
        html += `<div style="margin-top:16px">
            <button class="btn btn-success" onclick="downloadReport('${data.report_file}')">📥 下载审核报告 Excel</button>
        </div>`;
    }

    return html;
}

async function downloadReport(filename) {
    window.open('/api/download_report?file=' + encodeURIComponent(filename), '_blank');
}

// ========== 单个材料查询 ==========
async function singleSearch() {
    const keyword = document.getElementById('keyword').value.trim();
    const region = document.getElementById('region').value.trim();
    if (!keyword) { alert('请输入材料名称'); return; }
    const area = document.getElementById('singleResults'), load = document.getElementById('singleLoading');
    area.style.display = 'none'; load.classList.add('show');
    try {
        const res = await fetch('/api/search', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({keyword,region})});
        const data = await res.json();
        let html = `<div class="stat-row">
            <div class="stat-badge">关键词：<strong>${data.keyword||''}</strong></div>
            <div class="stat-badge">找到：<strong>${(data.results||[]).length}</strong> 条</div></div>`;
        if (!data.results || data.results.length === 0) {
            html += '<div class="empty">未查到价格信息，请尝试其他关键词或访问造价通官网</div>';
        } else {
            html += '<div class="result-card"><h3>'+data.keyword+'</h3>';
            data.results.forEach(r => {
                html += `<div style="display:flex;align-items:center;gap:12px;padding:6px 0">
                    <span style="font-size:22px;font-weight:800;color:#e74c3c">${r.price}</span>
                    <span style="color:#888">${r.unit}</span>
                    <span class="tag" style="background:#eee;color:#666">${r.source}</span>
                    <span style="font-size:12px;color:#999">${r.note||''}</span></div>`;
            });
            html += '</div>';
        }
        area.innerHTML = html; area.style.display = 'block';
    } catch(e) { area.innerHTML = '<div class="empty">查询失败: '+e.message+'</div>'; area.style.display = 'block'; }
    finally { load.classList.remove('show'); }
}

// ========== 记忆库 ==========
async function loadMemoryStats() {
    const el = document.getElementById('memoryContent');
    try {
        const res = await fetch('/api/memory_stats'); const data = await res.json();
        el.innerHTML = `<div class="result-card"><h3>🧠 记忆库状态</h3>
            <div class="stat-row">
                <div class="stat-badge">已审项目：<strong>${data.projects||0}</strong> 个</div>
                <div class="stat-badge">已记子目：<strong>${data.unique_items||0}</strong> 种</div>
            </div></div>`;
    } catch(e) { el.innerHTML = '<div class="empty">记忆库暂不可用</div>'; }
}
async function loadMemoryProjects() {
    const el = document.getElementById('memoryContent');
    try {
        const res = await fetch('/api/memory_projects'); const data = await res.json();
        let html = '<div class="result-card"><h3>📋 已审项目</h3><table><thead><tr><th>ID</th><th>项目名称</th><th>类型</th><th>造价</th><th>日期</th></tr></thead><tbody>';
        (data.projects||[]).forEach(p => {
            html += `<tr><td>${p.id}</td><td><strong>${p.name}</strong></td><td>${p.type}</td><td>${(p.total/10000).toFixed(1)}万元</td><td>${p.date}</td></tr>`;
        });
        html += '</tbody></table></div>';
        el.innerHTML = html;
    } catch(e) { el.innerHTML = '<div class="empty">记忆库暂不可用</div>'; }
}
async function recallPrice() {
    const kw = document.getElementById('recallKeyword').value.trim();
    if (!kw) { alert('请输入子目名称'); return; }
    const el = document.getElementById('memoryContent');
    try {
        const res = await fetch('/api/memory_recall?name=' + encodeURIComponent(kw)); const data = await res.json();
        let html = `<div class="result-card"><h3>🧠 召回结果: "${kw}"</h3>`;
        (data.items||[]).forEach(r => {
            html += `<div style="padding:8px 0;border-bottom:1px solid #eee">
                <strong>${r.name}</strong><br>
                均价: <span style="color:#2d6aa0;font-weight:700">${r.avg}元</span> &nbsp;
                范围: ${r.min}~${r.max} &nbsp; (${r.samples}个项目)
            </div>`;
        });
        el.innerHTML = html + '</div>';
    } catch(e) { el.innerHTML = '<div class="empty">查询失败</div>'; }
}

// 回车快捷键
document.getElementById('keyword')?.addEventListener('keydown', e => { if(e.key==='Enter') singleSearch(); });
document.getElementById('recallKeyword')?.addEventListener('keydown', e => { if(e.key==='Enter') recallPrice(); });
</script>
</body>
</html>
